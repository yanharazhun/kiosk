name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kiosk
          POSTGRES_PASSWORD: kiosk
          POSTGRES_DB: kiosk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiosk -d kiosk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kiosk:kiosk@localhost:5432/kiosk?schema=public
      SEED_ADMIN_PASSWORD: ci-admin-password
      SEED_KITCHEN_PASSWORD: ci-kitchen-password
      SEED_KIOSK_PIN: "1234"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
